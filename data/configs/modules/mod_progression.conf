# Warband config overrides for modules\mod_progression.conf
# Generated by Warband-Configs.ps1 -Action export. Tune the server, re-run export, commit this file.
# Only these keys are written by .\Warband-Configs.ps1 -Action apply; everything else in the
# installed file is left alone.
#
# Warband runs the last vanilla phase: the world stops at level 60, TBC and WotLK stay closed, and
# the phase is raised on purpose - nothing in the game advances it. Everything else keeps the
# module's own default, including the classic damage (0.6) and healing (0.5) multipliers.
# Raising the phase: change Progression.Phase, set Progression.Reset = 1 for that one start so the
# phase SQL is re-applied, then put Progression.Reset back to 0.

Progression.Phase = 6
Progression.DungeonFinder.Enforced = 0
