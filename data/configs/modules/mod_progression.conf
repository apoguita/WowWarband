# Warband config overrides for modules\mod_progression.conf
# Generated by Warband-Configs.ps1 -Action export. Tune the server, re-run export, commit this file.
# Only these keys are written by .\Warband-Configs.ps1 -Action apply; everything else in the
# installed file is left alone.
#
# seed: Progression.Phase
#
# Warband runs the last vanilla phase: the world stops at level 60, TBC and WotLK stay closed.
#
# Progression.Phase is a SEED, not an enforced value: it is written only into a file that still
# carries the shipped default, so a fresh install starts at phase 6. From then on the phase belongs
# to the in-game phase management - a game master picks it with `.warband phase set <0-18>` in the
# Warband panel, the module saves it and maintains this file (phase and the Progression.Reset the
# change needs). Applying this file again never undoes that choice.
#
# Everything else keeps the module's own default, including the classic damage (0.6) and healing
# (0.5) multipliers. Dungeon Finder enforcement is off because the Warband travel menu joins
# through LFG; which dungeons may be entered is still decided by the phase's map locks.

Progression.Phase = 6
Progression.DungeonFinder.Enforced = 0
