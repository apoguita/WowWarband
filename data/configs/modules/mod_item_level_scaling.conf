# Warband config overrides for modules\mod_item_level_scaling.conf
# Generated by Warband-Configs.ps1 -Action export. Tune the server, re-run export, commit this file.
# Only these keys are written by .\Warband-Configs.ps1 -Action apply; everything else in the
# installed file is left alone.

ItemScaling.ScaleDown = 0

# Warband runs on playerbots: bots are the party, so their levels must anchor dungeon loot
# scaling exactly like a real player's would. 1 would exclude bot sessions from the
# highest-level snapshot and from prewarm ownership whenever a session exposes IsBot().
ItemScaling.RealPlayersOnly = 0

# Quest rewards: hand out the scaled variant of the item at the quest's presented level
# (Warband.Quests.ScaleStep). Up only, equipment only; random-suffix, quest-starter and scripted
# rewards keep their original.
ItemScaling.QuestRewards = 1
