# Warband config overrides for modules\mod_warband.conf
# Generated by Warband-Configs.ps1 -Action export. Tune the server, re-run export, commit this file.
# Only these keys are written by .\Warband-Configs.ps1 -Action apply; everything else in the
# installed file is left alone.
#
# Quest scaling (Warband feature 55): quests present at the highest multiple of this step the
# character has reached - a level-15 quest reads and pays as level 20 from character level 20-24,
# then as level 25 from 25, and so on. Never lowered; quests above the character keep their level.
# The displayed level comes from the Warband core deviation in GossipDef.cpp, the awarded XP from
# the Warband quest-XP hook, and quest reward items from ItemScaling.QuestRewards.
Warband.Quests.ScaleStep = 5
