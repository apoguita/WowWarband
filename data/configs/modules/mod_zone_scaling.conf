# Warband config overrides for modules\mod_zone_scaling.conf
# Generated by Warband-Configs.ps1 -Action export. Tune the server, re-run export, commit this file.
# Only these keys are written by .\Warband-Configs.ps1 -Action apply; everything else in the
# installed file is left alone.
#
# Open-world level scaling (mod-zone-scaling): every outdoor zone presents its creatures,
# XP rewards, coin and (optionally) gear at the player's own level, so the whole world stays
# relevant at any level. Dungeons and raids are deliberately left to AutoBalance and
# mod-item-level-scaling, which already handle instances; enabling them here would double-scale.

# Master switch. 1 = open-world scaling active.
ZoneScaling.Enable = 1

# A zone with no row in mod_zone_scaling_zone still scales, using the default band below.
# 'clamp' means "one big scaled world"; use 'off' if you would rather opt zones in one row at a
# time via mod_zone_scaling_zone.
ZoneScaling.DefaultBehaviour = "clamp"
ZoneScaling.Default.MinLevel = 1
ZoneScaling.Default.MaxLevel = 80

# 'up' = level-up only: a creature below your level is raised to meet you, a creature already
# above you is left exactly as it is. Nothing in the open world is ever adjusted DOWN - the Warband
# rule is "low content comes up to you, high content stays dangerous".
ZoneScaling.Direction = "up"

# The module's shipped behaviour: each character sees the world at its own level, so a mixed-level
# party can fight the same mob at the same time, each at their own difficulty and reward level.
# (1 would anchor the whole group to the highest member's level - not wanted here.)
ZoneScaling.GroupAnchor = 0

# How many levels BELOW the player a scaled creature presents at. 0 = exactly the player's level.
ZoneScaling.TargetOffset = 0

# canonical level source: 'native' keeps each creature's own template level as the baseline.
ZoneScaling.CanonicalLevel = "native"

# Map kinds that may scale. Only the open world; instances stay with AutoBalance + item scaling.
ZoneScaling.Maps.World = 1
ZoneScaling.Maps.Dungeon = 0
ZoneScaling.Maps.Raid = 0
ZoneScaling.Maps.Battleground = 0
ZoneScaling.Maps.Arena = 0

# Elites/rares still present a few levels above the band so they read as dangerous.
ZoneScaling.PreserveEliteOffset = 1
ZoneScaling.PreserveEliteOffset.Max = 3

# Realm-wide scaling, not the per-player .chrono opt-in.
ZoneScaling.Chrono.Enable = 0

# Quest XP is priced by the Warband quest-scaling rule instead (Warband.Quests.ScaleStep in
# mod_warband.conf): the module's own per-zone quest pricing would correct the same award a
# second time, so it stays off and the Warband hook owns the correction.
ZoneScaling.Xp.Quests = 0

# Rewards follow the level actually fought at, or a scaled zone would be pointless.
ZoneScaling.Xp.Enable = 1
ZoneScaling.Xp.GreyKills = 1

# Correct a scaled kill's coin and eligible equipment drops to its effective level. Gear banding
# is enabled; it preserves slot, armor/weapon type and quality within the configured band.
ZoneScaling.Loot.Enable = 1
ZoneScaling.Loot.Money = 1
ZoneScaling.Loot.MoneyMax = 50.0
ZoneScaling.Loot.Gear = 1

# The settings that actually change fights: damage normalization, hit table, and the
# per-viewer nameplate/health display.
ZoneScaling.ScaleDamage = 1
ZoneScaling.ScaleHitChance = 1
ZoneScaling.ScaleLevelDisplay = 1
ZoneScaling.ScalePoolDisplay = 1
ZoneScaling.CoreView = 1
ZoneScaling.AggroRange = "stock"

ZoneScaling.Instanced.RequireExplicitBand = 1
ZoneScaling.Debug = 0
